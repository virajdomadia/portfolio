name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # The e2e step hung for 20+ minutes on 2026-09-23 (on untouched main too) and would have run
    # to GitHub's 6-hour default. A green run takes about two minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm test && pnpm build
      # `pnpm exec`, not `pnpm dlx`: dlx resolves playwright fresh from the registry rather than
      # running the CLI the lockfile pins (1.63).
      - run: pnpm exec playwright install --with-deps chromium
      # `line` rather than the CI default, so a future stall shows which test it reached.
      - run: pnpm exec playwright test --reporter=line
