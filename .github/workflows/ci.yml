name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # The e2e step hung for 20+ minutes on 2026-09-23 (on untouched main too) and would have run
    # to GitHub's 6-hour default. A green run takes about two minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm test && pnpm build
      # `pnpm exec`, not `pnpm dlx`: dlx resolves playwright fresh from the registry rather than
      # running the CLI the lockfile pins (1.63).
      - run: pnpm exec playwright install --with-deps chromium
      # Diagnostic run: the suite passes locally in under 90 s but produced no output at all on
      # the runner. `line` prints progress as tests finish, one worker removes contention, and
      # pw:api traces the exact call that stalls.
      - run: pnpm exec playwright test --workers=1 --reporter=line
        env:
          DEBUG: pw:api
